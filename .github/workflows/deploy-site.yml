name: Deploy Portfolio Site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy site on Raspberry Pi
    runs-on: [self-hosted, linux, ARM64, portfolio-site]

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Update repository
        run: |
          set -euo pipefail

          cd /home/broslam/GitRepos/portfolio-site-stevenBorkowskiDev

          git fetch origin main
          git reset --hard origin/main
          git status

      - name: Build React v2
        shell: bash
        run: |
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          source "$NVM_DIR/nvm.sh"

          APP_DIR="/home/broslam/GitRepos/portfolio-site-stevenBorkowskiDev/site/v2-react-tailwind"

          cd "$APP_DIR"

          echo "Node version:"
          node --version

          echo "npm version:"
          npm --version

          npm ci
          npm run lint

          rm -rf dist.next

          npm run build -- --outDir dist.next

          test -f dist.next/index.html
          test -d dist.next/assets

      - name: Publish React build
        run: |
          set -euo pipefail

          APP_DIR="/home/broslam/GitRepos/portfolio-site-stevenBorkowskiDev/site/v2-react-tailwind"

          cd "$APP_DIR"

          rm -rf dist.previous

          if [ -d dist ]; then
            mv dist dist.previous
          fi

          mv dist.next dist

          ls -la dist

      - name: Recreate portfolio container
        run: |
          set -euo pipefail

          cd /home/broslam/GitRepos/infra-stevenBorkowskiDev/docker

          docker compose config
          docker compose up -d --force-recreate nginx-prod

      - name: Verify deployment
        run: |
          set -euo pipefail

          INFRA_DIR="/home/broslam/GitRepos/infra-stevenBorkowskiDev/docker"

          cd "$INFRA_DIR"

          docker compose exec -T nginx-prod nginx -t

          sleep 3

          curl --fail --silent --show-error \
            --head \
            https://stevenborkowski.dev/

          docker compose ps nginx-prod