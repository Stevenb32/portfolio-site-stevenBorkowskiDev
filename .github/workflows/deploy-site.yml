name: Deploy Portfolio Site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy site on Raspberry Pi
    runs-on: [self-hosted, linux, ARM64, portfolio-site]

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy latest main branch
        run: |
          cd /home/broslam/GitRepos/portfolio-site-stevenBorkowskiDev
          git fetch origin main
          git reset --hard origin/main
          git clean -fd
          git status